[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2excel"
version = "0.1.0"
description = "Extract tables from PDF files into Excel workbooks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.11", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[project.scripts]
pdf2excel = "pdf2excel.cli:main"

[tool.setuptools]
packages = ["pdf2excel"]
